<!doctype html>
<html><head><meta charset="utf-8"><title>Ternary matvec bench</title>
<style>body{font:14px ui-monospace,monospace;background:#0b0b0e;color:#ddd;padding:16px}pre{white-space:pre-wrap}</style></head>
<body><h3>WebGPU ternary (2-bit slot) matvec bandwidth test</h3><pre id="log">running…</pre>
<script type="module">
const log = (s) => { document.getElementById('log').textContent += '\n' + s; console.log(s); };
document.getElementById('log').textContent = '';
const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
const device = await adapter.requestDevice({
  requiredFeatures: ['subgroups', 'timestamp-query', 'shader-f16'].filter((f) => adapter.features.has(f)),
  requiredLimits: { maxBufferSize: adapter.limits.maxBufferSize, maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize },
});

// Layout: W codes as u32 (16 trits per u32, q in {0,1,2}, w=(q-1)*s), row-major [M][K/16]
//         scales f32 [M][K/128], x f32 [K], y f32 [M]
const shader = (ROWS_PER_WG) => /* wgsl */ `
enable subgroups;
diagnostic(off, subgroup_uniformity);
@group(0) @binding(0) var<storage, read> W: array<u32>;
@group(0) @binding(1) var<storage, read> S: array<f32>;
@group(0) @binding(2) var<storage, read> X: array<vec4<f32>>;
@group(0) @binding(3) var<storage, read_write> Y: array<f32>;
struct P { M: u32, K: u32 };
@group(0) @binding(4) var<uniform> p: P;

@compute @workgroup_size(32, ${ROWS_PER_WG})
fn main(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>,
        @builtin(subgroup_invocation_id) lane: u32) {
  let row = wid.x * ${ROWS_PER_WG}u + lid.y;
  if (row >= p.M) { return; }
  let wpr = p.K / 16u;          // u32 words per row
  let base = row * wpr;
  var acc = 0.0;
  for (var j = lane; j < wpr; j += 32u) {
    let w = W[base + j];
    let s = S[row * (p.K / 128u) + j / 8u];
    let xb = j * 4u;            // 16 floats = 4 vec4
    var d = 0.0;
    for (var v = 0u; v < 4u; v++) {
      let xv = X[xb + v];
      let sh = v * 8u;
      let q = vec4<f32>(f32((w >> sh) & 3u), f32((w >> (sh + 2u)) & 3u), f32((w >> (sh + 4u)) & 3u), f32((w >> (sh + 6u)) & 3u));
      d += dot(q - vec4<f32>(1.0), xv);
    }
    acc += s * d;
  }
  acc = subgroupAdd(acc);
  if (lane == 0u) { Y[row] = acc; }
}`;

async function bench(M, K, nMats, label) {
  const ROWS = 8;
  const module = device.createShaderModule({ code: shader(ROWS) });
  const ci = await module.getCompilationInfo();
  for (const m of ci.messages) if (m.type === 'error') log('WGSL ' + m.lineNum + ': ' + m.message);
  const pipe = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
  const wBytes = M * K / 4, sBytes = M * (K / 128) * 4;
  const mats = [];
  for (let i = 0; i < nMats; i++) {
    const W = device.createBuffer({ size: wBytes, usage: GPUBufferUsage.STORAGE, mappedAtCreation: true });
    const u = new Uint32Array(W.getMappedRange());
    // random trits in {0,1,2} per 2-bit slot
    let st = (0x9e3779b9 * (i + 1)) >>> 0;
    for (let k = 0; k < u.length; k++) { st ^= st << 13; st ^= st >>> 17; st ^= st << 5; u[k] = (st & 0xAAAAAAAA) >>> 1 | (st & 0x55555555 & ~((st & 0xAAAAAAAA) >>> 1)); }
    W.unmap();
    const S = device.createBuffer({ size: sBytes, usage: GPUBufferUsage.STORAGE, mappedAtCreation: true });
    new Float32Array(S.getMappedRange()).fill(0.05); S.unmap();
    mats.push({ W, S });
  }
  const X = device.createBuffer({ size: K * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(X, 0, new Float32Array(K).map(() => Math.random() - 0.5));
  const Y = device.createBuffer({ size: M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const U = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(U, 0, new Uint32Array([M, K, 0, 0]));
  const groups = mats.map((m) => device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: m.W } }, { binding: 1, resource: { buffer: m.S } }, { binding: 2, resource: { buffer: X } },
    { binding: 3, resource: { buffer: Y } }, { binding: 4, resource: { buffer: U } }] }));
  const run = async (reps) => {
    const enc = device.createCommandEncoder();
    for (let r = 0; r < reps; r++) for (const g of groups) {
      const pass = enc.beginComputePass(); pass.setPipeline(pipe); pass.setBindGroup(0, g);
      pass.dispatchWorkgroups(Math.ceil(M / ROWS)); pass.end();
    }
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
  };
  await run(2);
  const reps = 10, t0 = performance.now();
  await run(reps);
  const dt = (performance.now() - t0) / 1000;
  const bytes = (wBytes + sBytes) * nMats * reps;
  const dispatches = nMats * reps;
  log(`${label}: ${M}x${K} x${nMats} mats (${((wBytes + sBytes) * nMats / 1e6).toFixed(0)} MB resident) -> ${(bytes / dt / 1e9).toFixed(1)} GB/s, ${(dt / dispatches * 1e6).toFixed(0)} us/matvec`);
  mats.forEach((m) => { m.W.destroy(); m.S.destroy(); });
  return bytes / dt / 1e9;
}

log(`adapter: ${adapter.info.vendor} ${adapter.info.architecture}`);
await bench(2048, 6144, 64, '1.7B-MLP-sized');
await bench(6144, 2048, 64, '1.7B-MLP-up-sized');
await bench(17408, 5120, 16, '27B-MLP-sized');
const gbps = await bench(5120, 17408, 16, '27B-down-sized');
log(`\nEstimate: Bonsai 2 27B PQ2_0 (7.2 GB) upper bound ≈ ${(gbps / 7.2).toFixed(1)} tok/s; ternary 8B (2.2 GB) ≈ ${(gbps / 2.2).toFixed(0)} tok/s; ternary 1.7B (0.46 GB) ≈ ${(gbps / 0.46).toFixed(0)} tok/s (weights-only bound)`);
log('DONE');
</script></body></html>
